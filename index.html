<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ButtercreamPro</title>

<!-- =====================================================================
     A página de vendas agora é a /b/. Esta raiz só encaminha para lá.

     O encaminhamento é feito por JavaScript, e não só pelo <meta refresh>,
     por um motivo: ele PRESERVA a query string. Campanha que aponte para
     buttercream.pro/?utm_source=... chega na /b/ com as UTMs inteiras,
     senão a venda perderia a atribuição.

     O <meta refresh> fica como rede de segurança, para quem estiver com
     JavaScript desligado.
     ================================================================== -->
<link rel="canonical" href="https://buttercream.pro/b/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=/b/">
<script>
  (function () {
    try {
      location.replace('/b/' + (location.search || '') + (location.hash || ''));
    } catch (e) {
      location.href = '/b/';
    }
  })();
</script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #fffaf6;
    color: #15205c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    text-align: center;
  }
  a { color: #15205c; }
</style>
</head>
<body>
  <p>Carregando… <a href="/b/">continuar</a></p>
</body>
</html>
