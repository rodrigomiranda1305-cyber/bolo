name: Publicar na Hostinger

# Sobe o site por FTP a cada push na branch principal.
# Só vão para o servidor o index.html e a pasta assets/ — a pasta build/
# (fontes das imagens) e o README ficam apenas no GitHub.
#
# Antes do primeiro uso, cadastre os segredos no repositório em
# Settings → Secrets and variables → Actions → New repository secret:
#   FTP_SERVER    ex.: ftp.seudominio.com.br
#   FTP_USERNAME  usuário de FTP criado no hPanel
#   FTP_PASSWORD  senha desse usuário

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite disparar manualmente pela aba Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Enviar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Pasta pública da Hostinger. Confirme no hPanel → Gerenciador de
          # Arquivos; em alguns planos o caminho é /domains/SEU-DOMINIO/public_html/
          server-dir: public_html/
          # Tudo que NÃO deve ir para o servidor
          exclude: |
            **/.git*
            **/.git*/**
            build/**
            README.md
            .gitignore
